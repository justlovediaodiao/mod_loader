name: Build steamclient_rdata_patch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S src/steamclient_rdata_patch -B build/steamclient_rdata_patch -A x64

      - name: Build
        run: cmake --build build/steamclient_rdata_patch --config Release --parallel

      - name: Install distributable files
        run: cmake --install build/steamclient_rdata_patch --config Release --prefix dist/steamclient_rdata_patch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: steamclient_rdata_patch-windows-x64
          path: dist/steamclient_rdata_patch
          if-no-files-found: error
