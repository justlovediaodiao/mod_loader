name: Build mod_loader

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S src/mod_loader -B build/mod_loader -A x64

      - name: Build
        run: cmake --build build/mod_loader --config Release --parallel

      - name: Install distributable files
        run: cmake --install build/mod_loader --config Release --prefix dist/mod_loader

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod_loader-windows-x64
          path: dist/mod_loader
          if-no-files-found: error
