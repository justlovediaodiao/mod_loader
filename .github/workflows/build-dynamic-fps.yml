name: Dynamic FPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/dynamic_fps

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: step-security/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $env:RUNNER_TEMP 'dynamic_fps'

          New-Item -ItemType Directory -Force `
            (Join-Path $packageDirectory 'mods') | Out-Null
          Copy-Item `
            'build/Release/dynamic_fps.dll' `
            (Join-Path $packageDirectory 'mods/')
          Copy-Item `
            'config.ini' `
            (Join-Path $packageDirectory 'mods/')

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dynamic_fps-windows-x64
          path: ${{ runner.temp }}/dynamic_fps

          if-no-files-found: error
