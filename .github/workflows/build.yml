name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mod_loader
            source: src/mod_loader
          - name: unity_fps_limit
            source: src/unity_fps_limit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S ${{ matrix.source }} -B build/${{ matrix.name }} -A x64

      - name: Build
        run: cmake --build build/${{ matrix.name }} --config Release --parallel

      - name: Install distributable files
        run: cmake --install build/${{ matrix.name }} --config Release --prefix dist/${{ matrix.name }}

      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-windows-x64
          path: dist/${{ matrix.name }}
          if-no-files-found: error
